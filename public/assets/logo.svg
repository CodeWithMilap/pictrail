<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Pictrail app icon. Master artwork: run `npm run icons` after editing to regenerate every size. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B7CFF"/>
      <stop offset="1" stop-color="#2238C2"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA552"/>
      <stop offset="1" stop-color="#F2651A"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C3D2FF"/>
      <stop offset="1" stop-color="#A9BEFF"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0B1A6B" flood-opacity=".35"/>
    </filter>
    <filter id="pin-shadow" x="-50%" y="-30%" width="200%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5A2200" flood-opacity=".35"/>
    </filter>
    <clipPath id="photo"><rect x="276" y="368" width="472" height="372" rx="30"/></clipPath>
  </defs>

  <!-- background tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>

  <!-- back card of the stack -->
  <rect x="236" y="270" width="552" height="452" rx="56" fill="#FFFFFF" opacity=".32" transform="rotate(-9 512 496)"/>

  <!-- front card -->
  <rect x="236" y="328" width="552" height="452" rx="56" fill="#FFFFFF" filter="url(#card-shadow)"/>

  <!-- photo inside the card -->
  <g clip-path="url(#photo)">
    <rect x="276" y="368" width="472" height="372" fill="#EEF2FF"/>
    <path d="M250 640 C 340 580 420 590 512 632 C 600 672 680 628 780 580 L780 760 L250 760 Z" fill="url(#hill)"/>
    <!-- the trail -->
    <path d="M318 706 C 392 664 384 596 458 572 C 532 548 600 560 640 492"
          fill="none" stroke="#FF8A3D" stroke-width="24" stroke-linecap="round" stroke-dasharray="0.1 46"/>
  </g>

  <!-- location pin at the end of the trail -->
  <g transform="translate(648 470)" filter="url(#pin-shadow)">
    <path d="M0 0 C -14 -36 -78 -84 -78 -146 A 78 78 0 1 1 78 -146 C 78 -84 14 -36 0 0 Z" fill="url(#pin)"/>
    <circle cx="0" cy="-146" r="30" fill="#FFFFFF"/>
  </g>
</svg>
